# ─── Workflow (multi-agent) ─────────────────────────────
# A workflow is a graph of agents connected by transitions.
# A site has either `agent:` (single-agent) OR `workflow:` (multi-agent),
# never both, never neither. Workflows REQUIRE
# sceneGeneration.brainMode = ONE_BRAIN.
#
# See `.agent/workflows/multi-agent-workflows.md` in this template for a
# step-by-step guide.

workflow:
  # ── Top-level workflow fields ─────────────────────────
  name: string                  # required — unique per client
  description: string?          # optional — shown in the editor
  entry: string                 # required — must match an agents[].name
  advancedRouting: boolean      # default false — enables fast-model
                                # routing (auto-injects transfer_to_*
                                # tools, scored by a small LLM)
  fastModel: string?            # required when advancedRouting = true
                                # (e.g. "groq:openai/gpt-oss-20b")
  fastModelPrompt: string?      # optional — system instruction for the
                                # classifier LLM. Tells the model HOW to
                                # decide which agent to hand off to. The
                                # runtime fills in the actual list of
                                # transitions and the user's utterance, so
                                # this prompt should NOT duplicate either.
                                # Leave omitted to use the built-in default.

  # ── agents: at least one ──────────────────────────────
  # Each entry uses the same fields as the single-agent `agent:` block
  # (llm, voice, stt, behavior, avatar) plus the per-agent fields below.
  agents:
    - name: string              # required — unique within workflow,
                                # used by transitions and transferAgent()
      llm:                      # see llm_providers above
        provider: string
        model: string
        temperature: number     # 0.0 – 2.0
      voice:                    # see voice_providers above
        provider: string
        voiceId: string?
        model: string?
      stt:                      # see stt_providers above
        provider: string
        language: string
      knowledge:
        maxTotalResults: integer?      # 1 – 20, default unset (no cap). Caps the
                                       # TOTAL results one knowledge search returns
                                       # across all attached KBs combined, keeping
                                       # the best-scoring ones. Each KB still
                                       # contributes at most its own per-KB limit.
      behavior:
        allowInterruptions: boolean
        interruptionThreshold: number  # 0.0 – 1.0, default 0.5. How sure the tele
                                       # must be it heard speech before it stops
                                       # talking. Raise for noisy rooms.
        minInterruptionWords: integer  # 0 – 10, default 0. Ignore interruptions
                                       # shorter than N words (brief sounds).
        endpointingDelay: number       # 0.0 – 3.0 seconds, default 0.5. Silence
                                       # before the tele decides the user is done.
        turnDetection: semantic | vad  # default semantic: an end-of-turn model
                                       # hears whether the sentence sounds
                                       # finished and waits longer through a
                                       # mid-thought pause. vad: silence only.
        maxEndpointingDelay: number?   # 0.5 – 5.0 seconds, default 2.5 (omit).
                                       # Longest wait when the user sounds
                                       # unfinished (semantic only). null clears.
      avatar:
        enabled: boolean
        provider: string?
        avatarId: string?
        greetingWaitsForReady: boolean?  # default false. When true, the greeting
                                         # waits for the avatar video to connect so
                                         # audio + video appear together. When false,
                                         # the greeting plays immediately (audio is
                                         # faster than the avatar connect time).

      # ── Per-agent prompt files (paths relative to repo root) ──
      # speakLlm is required; showLlm is optional (one-brain scene
      # rendering description for this agent). The speakLlm file is read on
      # every deploy and written to THIS agent's prompt (MAIN-174).
      prompts:
        speakLlm: string        # required — path to .md file
        showLlm: string?        # optional — per-agent scene_viewer prompt

      # ── Per-agent KB / MCP / tool overrides ───────────
      knowledgeBases: [string]  # KB slugs (referenced from top-level
                                # knowledgeBases definitions)
      mcpServers: [string]      # MCP server names (referenced from
                                # top-level mcpServers definitions)
      systemToolOverrides:
        scene_viewer:
          description: string?
        # ... any built-in tool name ...
      siteFunctions: [string]   # MAIN-176 — the site functions THIS voice
                                # may call (omit = all of the site's)

  # ── transitions: edges in the agent graph ─────────────
  transitions:
    - from: string              # required — must match an agents[].name
      to: string                # required — must match an agents[].name
      description: string       # required, non-empty — what the LLM sees
                                # when deciding to call transfer_to_<to>
      preserveHistory: boolean  # default true — when false, the next
                                # agent starts with empty chat context
      llmCanTrigger: boolean    # default true — when false, the LLM
                                # cannot trigger this edge (frontend-only
                                # via transferAgent())
      handoffPhrase: string?    # optional — spoken by the outgoing agent
                                # before the swap. Plain text, no SSML.
                                # e.g. "Let me bring in our specialist."

# Validation rules (enforced by the deserializer):
#   - workflow.entry must reference an agents[].name.
#   - Every transitions[].from and to must reference an agents[].name.
#   - Every transitions[].description must be non-empty.
#   - Agent names within a workflow are unique.
#   - No duplicate (from, to) pairs.
#   - advancedRouting=true requires fastModel.
#   - sceneGeneration.brainMode must be ONE_BRAIN when workflow: is present.
#   - platform.yaml must contain workflow: OR agent:, never both, never neither.

# ─── Greeting ───────────────────────────────────────────
# Two independent greetings exist:
#   site.greeting   — text shown in the widget UI before the call starts.
#   agent.greeting  — the first thing the agent SAYS when the call connects.
# Both are plain strings (max 500 chars). Omit either to leave the current
# dashboard value unchanged.
#
#   site:
#     greeting: "Welcome! Tap to talk."
#   agent:
#     greeting: "Hi there — how can I help you today?"

# ─── Silent reply ───────────────────────────────────────
# agent.silentReply (also per workflow agent): a reply that is ONLY this token,
# ignoring whitespace, punctuation and case, is never spoken — the agent goes
# straight back to listening and the transcript marks the turn silent.
# Max 100 chars. Omit to leave the dashboard value; null turns it off.
#
#   agent:
#     silentReply: "(listening)"

# ─── Path Prefix (reverse proxy under a sub-path) ───────
# Set `site.pathPrefix` when your own CDN / reverse proxy (e.g. CloudFront)
# serves this site under a sub-path of your domain, e.g.
# https://example.com/ai/works/ai-expert → <subdomain>.sites.mobeus.ai.
# The build bakes the prefix into all asset URLs (Next.js basePath — the
# template's next.config.ts reads it from NEXT_PUBLIC_BASE_PATH), and the
# deploy maps the prefixed paths back to the site root on our origin, so the
# direct <subdomain>.sites.mobeus.ai URL keeps working too. Your proxy should
# forward request paths to the origin AS-IS (no stripping needed).
#
# Rules: must start with "/", segments limited to letters, digits, ".", "_",
# "-"; no trailing slash; max 200 chars. Set to null to go back to serving at
# the root. NOTE: hardcoded references to public/ files in your own code
# (e.g. <img src="/logo.svg">) are NOT rewritten by Next.js — prefix them
# with process.env.NEXT_PUBLIC_BASE_PATH yourself.
#
#   site:
#     pathPrefix: /ai/works/ai-expert

# ─── AirVision: touchless hand control ─────────────────
# Adds an opt-in "Enable hand control" button to the tele. Visitors drive the
# page with their hand via the webcam (pinch thumb+index to click). All vision
# processing runs on the visitor's device — the camera stream never leaves the
# browser. `enabled` only takes effect when your org is entitled to AirVision
# (a platform grant); ask your account team if it isn't. Set the block to null
# to disable and clear any overrides.
#
#   site:
#     airVision:
#       enabled: true             # activate on this tele (needs org entitlement)
#       hand: any                 # left | right | any (which hand drives the cursor)
#       sensitivity: 0.6          # 0..1 cursor responsiveness (higher = snappier)
#       mirror: true              # selfie-mirror the movement (recommended)
#       themeColor: "#4F8CFF"     # accent for the rendered hands (defaults to widget color)
#       # engine / renderer: advanced — swap the detection/visual backend by id
#       engine: mediapipe-hands
#       renderer: glow-hands

# ─── Prompt File Paths (single-agent) ──────────────────
# The `prompts` section points at the .md files that hold your prompt TEXT
# (platform.yaml carries settings, not prompt bodies). Paths are relative to
# the repo root and may be relocated anywhere — the deploy reads them from
# wherever you point. Omit a path to fall back to the public/prompts/*.md
# default.
#
#   prompts:
#     speakLlm: src/prompts/agent.md     # voice-agent system prompt
#     showLlm:  src/prompts/scene.md     # show-LLM / scene-viewer prompt

# ─── widget: appearance + position ─────────────────────
# Controls the floating voice widget's look. See enums.widgetPosition above.
#
#   widget:
#     position: bottom-right      # bottom-right | bottom-left | top-right | top-left
#     primaryColor: "#000000"     # hex accent color used on the bubble

# ─── sceneGeneration: scene rendering brain mode ───────
# Controls how the agent decides what to show on screen.
# brainMode + uiEngine options live on top-level enums above.
#
#   sceneGeneration:
#     brainMode: ONE_BRAIN
#     uiEngine:
#       enabled: true
#       model: gpt-4o-mini        # short, fast model recommended
#       knowledgeMode: SEARCH     # SEARCH | CONTEXT
#     contextSharing:
#       shareVoiceContext: true
#       shareSceneContext: true

# ─── toolAnnouncement: spoken tool-call narration ──────
# Whether the agent says "let me search that for you" before running a tool.
# `phrases` is the global pool. `phrasesByTool` overrides per tool name.
#
#   toolAnnouncement:
#     mode: SPEECH                # SPEECH | SILENT
#     phrases:
#       - "One moment."
#       - "Let me check."
#     phrasesByTool:
#       search_knowledge:
#         - "Looking that up."

# ─── paths: where the deploy expects shared registries ─
# Override these only if your repo lays out the registries differently.
#
#   paths:
#     siteFunctions:  src/site-functions/register.ts
#     teleComponents: src/components/tele-components/component-registry.ts

# ─── defaults: voice session defaults ──────────────────
# Per-session defaults applied when a user opens the widget. These can be
# overridden by the user mid-session (mic/volume mute, avatar toggle).
#
#   defaults:
#     avatarEnabled: true     # run an avatar at all; false = never started,
#                             # never offered to the visitor, never billed
#     avatarVisible: true     # avatar starts visible (vs minimized). Hiding it
#                             # does NOT stop the stream or the billing —
#                             # use avatarEnabled: false for that
#     micMuted: false         # mic on at session start
#     volumeMuted: false      # speaker on at session start
#     knowledgeMaxTotalResults: 4  # 1 – 20, default unset. Per-WEBSITE override of
#                                  # agent.knowledge.maxTotalResults (total records
#                                  # one knowledge search returns across all KBs).
#                                  # Omit to inherit the agent's cap; null clears.

# ─── sessionLifecycle: tele-level session timeouts ─────
# Overrides the org / platform session-lifecycle policy FOR THIS WEBSITE only.
# Resolution cascade at runtime: this block ?? org default ?? platform default.
# Omit a field to inherit; set it to override. These are web/widget settings —
# phone sessions resolve org→platform (phone numbers are org-scoped), so there
# are no phone fields here; set phone overrides at the org level instead.
# All seconds values are capped at 86400 (1 day).
#
#   sessionLifecycle:
#     enabled: true              # master switch for automatic timeouts
#     webIdleTimeoutSec: 180     # end after this much silence (no human speech)
#     webMaxDurationSec: 600     # hard cap regardless of activity (e.g. 10 min)
#     afterUserLeavesSec: 60     # grace before ending once the last human leaves
#     prewarmGraceSec: 180       # sweep un-activated pre-warm rooms after this

# ─── decisionTool: Jev picks the certified card (MAIN-175) ─────
# This site's own settings for the decision tool (TypeSafe Jev). Wins over the
# organisation's settings. The tool is only ON when a super admin has granted
# it to the organisation (platform-admin → Clients → org → Decision tool).
# `null` clears these and falls back to the organisation's settings.
#
#   decisionTool:
#     instructions: Which certified card answers what the visitor just said?
#     options: { source: site_catalog }   # manual | certified_scenes | site_catalog
#     catalog: platform/decision-catalog.json   # read on every deploy (site_catalog)
#     threshold: 0.7                      # below this nothing confident is applied…
#     fallbackKey: GAP                    # …except this card, if set (apply only)
#     trigger: before_reply               # llm | every_turn | before_reply
#     action: apply                       # return | apply
#     apply: { siteFunction: showMoment, argName: card, exclusive: false }
#     includeStay: true                   # a "nothing new" option for follow-ups
#     contextTurns: 4
#
# The catalog file is a JSON array of options (2 to 2000):
#   [{ "key": "Q06", "description": "How GLP-1 medicines work. Asked as: ...",
#      "agent": "live_nori",              # only this workflow agent is offered it
#      "say": "Exact approved line"       # spoken word for word (before_reply)
#   }, ...]
# `before_reply` waits for the pick before the tele answers, so the answer is
# written with the card already on screen; a card with `say` is spoken as is.
# ─── memory: remember consenting visitors (MAIN-179) ─────
# With memory on, each voice keeps a short summary of what a visitor told it,
# but only after the visitor agrees (30 days, one year or until deleted).
# The site's own consent and "forget me" controls call /api/widget/memory;
# forgetting removes the memory, the consent, the visitor's reel likes and
# the transcripts of their sessions on this site. Needs conversation capture.
#
#   memory:
#     enabled: true

# ─── allowance: a token wallet for each visitor ─────
# With the site's visitor wallet on (an org owner or admin switches it on in the
# dashboard: Website → Visitor wallet; this file cannot), each visitor starts
# with `grant` tokens, given once at their first call, and spends them by the
# seconds they talk at LiveCast's rate (10,000 tokens an hour, 167 a minute).
# A minute before zero the voice says the call ends in about a minute; at zero
# it counts down 15 s, says goodbye and ends the call; the server ends it 30 s
# after zero at the latest. The site reads the balance and talk time per voice
# from /api/widget/wallet and hears `wallet.warning` / `wallet.countdown` on the
# room data topic `mobeus.wallet` (docs/visitor-wallet.md in the platform repo).
# Without sign-in it is a nudge, not a limit (clearing storage starts again).
# These tokens are the site's own, never the organization's credits.
#
#   allowance:
#     grant: 1000            # starting tokens (default 1000, about 6 minutes)

# ─── hostCall: bring the site's human host into a web call ─────
# The advisor can offer to bring in the host (a person, e.g. "Geof Corb").
# On the visitor's yes it dials the host's mobile into the same call. The
# advisor then listens without speaking (stay_muted) until asked back in by
# name, and can be told to leave. Status reaches the page on the room data
# topic `mobeus.host_call` (see docs/host-call.md in the platform repo).
# The host's PHONE NUMBER never goes in this file: an org owner/admin sets it
# in the dashboard (Website → Host call), where it is stored encrypted.
#
#   hostCall:
#     enabled: true
#     label: "Geof Corb"              # spoken and shown
#     maxPerSession: 1                # dial attempts per visit (default 1)
#     maxPerDay: 10                   # per site, rolling 24h (default 10)
#     aiBehaviorDefault: stay_muted   # stay_muted (default) | stay_active
#     smsOnRing: false                # text the host the reason while it rings
#     ringTimeoutSec: 25              # 10-45 (default 25)
#     hearHost: true                  # advisor follows the host in memory (never saved)
#     wakeWords: [Marcus]             # default: each advisor's own name
#     hours:                          # omit = any time
#       timezone: America/New_York
#       windows:
#         - { days: [mon, tue, wed, thu, fri], start: "09:00", end: "17:00" }

# ─── integrations: connected OAuth apps (Slack, Google, etc.) ───
# OAuth-based integrations are CONNECTED once via the Apps page in the
# dashboard — `platform.yaml` cannot create them (the OAuth popup must run
# interactively). Use this section to say which connected integrations this
# agent can call, and (optionally) which of their tools.
# See `integration_providers:` higher up for the full provider enum + tool
# names.
#
#   integrations:
#     - provider: SLACK
#       allowedTools: [slack_post_message, slack_list_channels]
#     - provider: GOOGLE_WORKSPACE
#       # omit allowedTools to grant every tool the provider exposes

# ─── Secrets in MCP headers / env ──────────────────────
# Never put raw API keys or bearer tokens in this YAML. Even private repos
# leak secrets through git history, mirrors/forks, CI logs, and GitHub's
# secret-scanning (which will warn loudly).
#
# The platform handles this for you:
# - The dashboard's "Push to GitHub" REDACTS every header / env VALUE to the
#   literal "<set-in-dashboard>" placeholder. The keys still round-trip so
#   the shape (which headers exist, which env vars exist) stays declarative.
# - On apply, the deserializer treats "<set-in-dashboard>" as "leave the
#   dashboard value alone" — so pushing a serialized YAML never overwrites a
#   real secret with the literal placeholder.
# - Setting a REAL value in YAML still overwrites the dashboard (intentional,
#   for "rotate bearer key" via repo). Just rotate, push, then redact again.
#
# Example shape the serializer emits:
#
#   mcpServers:
#     - name: crm
#       transportType: HTTP
#       url: https://crm.example.com/mcp
#       headers:
#         Authorization: "<set-in-dashboard>"   # value lives in the dashboard
#       env:
#         CRM_TENANT_ID: "<set-in-dashboard>"
#
# To rotate the key from the repo: replace the placeholder with the real
# value, push, then the platform applies it. Then push from the dashboard
# again to redact it back to the placeholder.

# ─── TTS Pronunciation Overrides ───────────────────────
# Regex patterns rewritten in the LLM's text before TTS speaks it.
#
# Belongs nested UNDER `agent:` — NOT at the top level. Top-level placement
# is silently dropped because the schema attaches ttsReplacements per-agent
# (a common cause of "I added ttsReplacements but they don't show up").
# Each rule: { pattern, replacement, label? }. Up to 500 rules per agent.
#
#   agent:
#     ttsReplacements:
#       - pattern: "API"
#         replacement: "ay pee eye"
#       - pattern: "WSJ"
#         replacement: "Wall Street Journal"
#         label: "expand acronym"            # optional, dashboard-only

# ─── Settings reach BOTH web and phone agents ──────────
# Anything you set here flows into the platform database via the deploy. Web
# sessions and phone (LiveKit SIP) calls both read from the same agent rows,
# so settings here affect every channel the agent runs on. The phone path
# does NOT read this file directly at call time — it queries the DB, which
# the deploy already updated for it.

# ─── A note on this file ───────────────────────────────
# platform-options.yaml is a human/agent REFERENCE only — nothing reads it at
# deploy time. Repos created before this file existed deploy fine without it;
# it is safe to add, omit, or regenerate from the starter template at any time.
