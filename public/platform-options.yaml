# need their API key configured on the deployment — an org without the grant
# gets LiveAvatar regardless of what platform.yaml names.
avatar_providers:
  - { id: liveavatar, name: "HeyGen / LiveAvatar (default, every org)" }
  - { id: runway, name: "Runway Characters (per-org grant)" }
  - { id: anam, name: "Anam (per-org grant)" }

# ─── Enum Values ────────────────────────────────────────

enums:
  brainMode:
    - ONE_BRAIN    # Voice agent LLM generates scenes directly
    - TWO_BRAIN    # Separate UI Engine generates scenes (default)

  toolAnnouncementMode:
    - SILENT       # No output when tools are called
    - SPEECH       # Agent announces tool calls (default)

  uiEngineKnowledgeMode:
    - SEARCH       # search_knowledge tool per request (default, handles large KBs)
    - CONTEXT      # Load all KB content into context window (fast, limited size)

  widgetPosition:
    - bottom-right # Default
    - bottom-left
    - top-right
    - top-left

  mcpTransportType:
    - HTTP          # Streamable HTTP (most common for remote servers)
    - SSE           # Server-Sent Events
    - STDIO         # Local process (command + args)

# ─── Connected App Integrations ────────────────────────
# OAuth-based providers connected via the Apps page in the dashboard.
# platform.yaml only references already-connected providers; the OAuth
# popup must run interactively. Reference by `provider` (case-sensitive
# enum, exactly as below).
#
# Each provider exposes a fixed set of tools. Use the names below in
# `allowedTools:` on the agent to scope what each agent can call.

integration_providers:
  SLACK:
    description: "Post messages, read channels, send DMs in your Slack workspace."
    tools:
      slack_list_channels:        "List channels the bot has been added to."
      slack_post_message:         "Post a message to a Slack channel (or thread)."
      slack_get_channel_history:  "Read recent messages from a channel."
      slack_list_users:           "List workspace users."
      slack_lookup_user_by_email: "Find a user by email address."
      slack_send_dm:              "Send a direct message to a user."

  GOOGLE_WORKSPACE:
    description: "Gmail, Google Calendar, Google Drive."
    tools:
      google_calendar_list_events:    "List events from a Google Calendar."
      google_calendar_create_event:   "Create a new calendar event."
      google_calendar_update_event:   "Update an existing calendar event."
      google_calendar_delete_event:   "Delete a calendar event."
      google_gmail_list_messages:     "List Gmail messages matching a query."
      google_gmail_get_message:       "Get a specific Gmail message by ID."
      google_gmail_send_message:      "Send an email via Gmail."
      google_drive_list_files:        "List files in Google Drive."
      google_drive_get_file:          "Get metadata for a Drive file."

  MICROSOFT_365:
    description: "Outlook Mail & Calendar, OneDrive via Microsoft Graph."
    tools:
      outlook_list_messages:  "List recent Outlook email messages."
      outlook_get_message:    "Get a specific Outlook message by ID."
      outlook_send_message:   "Send an Outlook email."
      outlook_list_events:    "List upcoming Outlook calendar events."
      outlook_create_event:   "Create a new Outlook calendar event."
      outlook_update_event:   "Update an existing Outlook calendar event."
      outlook_delete_event:   "Delete an Outlook calendar event."
      onedrive_list_files:    "List files in the user's OneDrive."
      onedrive_get_file:      "Get metadata for a OneDrive item."

# Allowedtools semantics (matches MCP servers):
#   field omitted → all tools allowed
#   []            → no tools allowed
#   [name, ...]   → explicit allowlist

# ─── MCP Server Fields ─────────────────────────────────
# Servers listed in platform.yaml are auto-created if they don't exist.
# Sensitive fields (headers, env vars) must be set in the dashboard.

mcp_server_fields:
  name: "Required. Server name (must be unique per client)."
  description: "Optional. Human-readable description."
  transportType: "Required for auto-creation. HTTP | SSE | STDIO."
  url: "HTTP/SSE only. The MCP server endpoint URL."
  headers: "HTTP/SSE only. Auth headers as key-value pairs (e.g. Authorization: Bearer ...)."
  command: "STDIO only. The command to run (e.g. 'npx', 'python')."
  args: "STDIO only. Array of arguments (e.g. ['-y', 'my-server'])."
  env: "STDIO only. Environment variables as key-value pairs (e.g. API_KEY: sk-...)."
  cwd: "STDIO only. Working directory for the command."
  allowedTools: "Optional. Array of tool names to expose (null = all tools)."
  useProxy: "Optional. HTTP/SSE only. Route through the Mobeus proxy (single static egress IP) — use when the server is behind an IP allowlist."
  authMode: "Optional. STATIC (default) uses the static headers above. USER_TOKEN forwards the signed-in end user's own bearer token, scoped per user (implies useProxy). HTTP/SSE only. Requires the tele UI to push the user's token."

# Example — top-level mcpServers definitions (referenced by name from
# agent.mcpServers / agents[].mcpServers). Auto-created on first deploy.
#
# mcpServers:
#   # 1) Standard server with a static API key:
#   - name: my-crm
#     transportType: HTTP
#     url: https://mcp.example.com/mcp
#     headers:
#       Authorization: Bearer sk-...      # sensitive — prefer setting in dashboard
#     allowedTools: [search, create_ticket]
#
#   # 2) Per-user token server (e.g. BrightNight cockpit):
#   - name: cockpit
#     transportType: HTTP
#     url: https://cockpit.brightnightpower/mcp
#     authMode: USER_TOKEN                 # forwards the signed-in user's token
#     # useProxy is forced on automatically for USER_TOKEN
#     allowedTools: [dashboard, gauge-metrics, compare-periods]
#
# agent:                                   # (or agents[] in a workflow)
#   mcpServers: [my-crm, cockpit]          # attach by name

