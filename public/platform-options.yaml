# ─── STT Providers ──────────────────────────────────────

stt_providers:
  - id: deepgram
    name: "Deepgram (Default)"
    models:
      - { id: nova-3, name: "Nova-3 (multilingual & best accuracy)" }
      - { id: nova-3-general, name: "Nova-3 General" }
      - { id: nova-2, name: "Nova-2 (English-focused, lowest latency)" }
      - { id: nova-2-general, name: "Nova-2 General" }
      - { id: nova-2-phonecall, name: "Nova-2 Phonecall" }
  - id: openai
    name: "OpenAI Whisper"
    models:
      - { id: whisper-1, name: "Whisper-1" }
      - { id: gpt-4o-transcribe, name: "GPT-4o Transcribe" }
      - { id: gpt-4o-mini-transcribe, name: "GPT-4o Mini Transcribe" }
  - id: elevenlabs
    name: "ElevenLabs Scribe"
    models:
      - { id: scribe_v2_realtime, name: "Scribe v2 Realtime (streaming)" }
      - { id: scribe_v2, name: "Scribe v2" }
      - { id: scribe_v1, name: "Scribe v1 (legacy batch)" }
  - id: meta
    name: "Meta Muse Voice Transcribe"
    models:
      - { id: muse-voice-transcribe-1.0, name: "Muse Voice Transcribe 1.0" }
    # Muse is the lowest-cost STT on the platform. It covers 25 languages —
    # NOT Russian (the only language in the list below it cannot serve). An
    # agent set to an unsupported language is served by Deepgram instead.
  - id: assemblyai
    name: "AssemblyAI (coming soon)"
    models: []

# agent.stt.model is optional. Leave unset (or null) and the agent picks a
# default: Deepgram → nova-2 (or nova-3 when language is "multi"); OpenAI →
# whisper-1; ElevenLabs → scribe_v2_realtime; Meta → muse-voice-transcribe-1.0.

# ─── Avatar Providers ───────────────────────────────────

