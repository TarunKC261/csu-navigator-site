# ─── Language Codes (common) ────────────────────────────
# agent.stt.language accepts any valid language code, or "multi" for
# automatic multilingual detection / code-switching (Deepgram nova-3:
# English, Spanish, French, German, Hindi, Russian, Portuguese, Japanese,
# Italian, Dutch — or Whisper auto-detect when sttProvider is "openai").
# Meta Muse auto-detects on "multi" too, but does not cover Russian, Swedish,
# Danish, Finnish or Norwegian — those fall back to Deepgram.
# Common codes (Deepgram/Whisper supported):

